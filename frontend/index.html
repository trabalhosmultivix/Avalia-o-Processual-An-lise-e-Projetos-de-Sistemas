<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistema de Gestão de Eventos e Inscrições Acadêmicas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Sans:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Tela de login: primeiro escolhe o tipo de acesso, depois autentica -->
  <div class="login-screen" id="login-screen">
    <div class="login-card" id="login-card"></div>
  </div>

  <!-- Aplicação (visível somente após login) -->
  <div class="app" id="app-screen" style="display:none;">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-logo">
        <div class="logo-mark">EA</div>
        <span class="logo-text">Eventos Acadêmicos</span>
      </div>

      <nav class="sidebar-nav" id="sidebar-nav">
        <!-- Itens montados dinamicamente conforme o perfil (Estudante x Administrador) -->
      </nav>

      <div class="sidebar-user" id="sidebar-user" title="Ver perfil">
        <div class="user-avatar" id="user-avatar">--</div>
        <div class="user-info">
          <div class="user-name" id="user-name">—</div>
          <div class="user-role" id="user-role">—</div>
        </div>
        <button class="sidebar-logout" id="btn-sidebar-logout" title="Sair">⏻</button>
      </div>

      <button class="sidebar-toggle" id="sidebar-toggle" title="Recolher menu">‹</button>
    </aside>

    <!-- Main -->
    <main class="main">
      <header class="topbar">
        <div class="topbar-title" id="topbar-title">Sistema de Gestão de Eventos e Inscrições Acadêmicas</div>
        <div class="topbar-right">
          <span class="topbar-semester">Semestre <strong>2026/2</strong></span>
        </div>
      </header>

      <div class="content" id="content">
        <!-- Páginas são renderizadas aqui via JS -->
      </div>
    </main>
  </div>

  <!-- Modal genérico (inscrição, formulário de evento, confirmação, senha) -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal-box" id="modal-box"></div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/render.js"></script>
  <script src="js/modals.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
